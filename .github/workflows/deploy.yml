name: Deploy to Vercel (production)

# Deploys to Vercel from CI instead of relying on Vercel's Git integration
# (production auto-deploy from the prod branch stopped firing). Runs on every
# push to the production branch and can be triggered by hand.
#
# One-time setup: add three repo secrets (Settings -> Secrets and variables ->
# Actions): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID. Get the token from
# Vercel -> Account Settings -> Tokens; get the org/project IDs from the Vercel
# project's .vercel/project.json (run `vercel link` locally) or Project Settings.

on:
  push:
    branches:
      - claude/pensive-bell-J2VAJ
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings + env (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
